[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hecke-kl"
version = "0.1.0"
description = "Hecke algebra and Kazhdan-Lusztig polynomial simulator for finite Coxeter groups"
requires-python = ">=3.9"
dependencies = ["sympy>=1.10", "koppa>=0.1.1"]

[project.scripts]
hecke-kl = "hecke_kl.cli:main"

[tool.setuptools]
packages = ["hecke_kl"]
